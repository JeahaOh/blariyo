name: CI
on:
  pull_request:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full SHA to compare with the selected ref
        required: true
        type: string
      purpose:
        description: Why this manual verification is running
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  event-context:
    runs-on: ubuntu-24.04
    outputs:
      subject_sha: ${{ steps.bind.outputs.subject_sha }}
      context_sha256: ${{ steps.bind.outputs.context_sha256 }}
      bindings_sha256: ${{ steps.bind.outputs.bindings_sha256 }}
      base_sha: ${{ steps.bind.outputs.base_sha }}
      head_sha: ${{ steps.bind.outputs.head_sha }}
      event_name: ${{ steps.bind.outputs.event_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: bind
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/harness/cli.mjs ci-context "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/ci-context.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: ci-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-context.json
          retention-days: 14
          if-no-files-found: error
  quality:
    needs: [event-context]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Confirm shared event subject
        env:
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA" && test -n "$CONTEXT_SHA256" && test -n "$BINDINGS_SHA256"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: '3.12.11'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check -r .quality/requirements.txt
      - run: npm run test:harness
      - run: npm run test:quality
      - run: npm run lint:harness
      - name: Lint using the target branch's trusted debt baseline
        env:
          LINT_BASELINE_SHA: ${{ needs.event-context.outputs.base_sha }}
        run: npm run lint:all
      - run: npm run test:architecture
      - name: Validate pull request branch direction
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: node scripts/harness/cli.mjs pr-policy "$HEAD_BRANCH" "$BASE_BRANCH" && node scripts/harness/cli.mjs task-range "$HEAD_BRANCH" "$BASE_SHA" "$HEAD_SHA" && node scripts/harness/cli.mjs task-range "$HEAD_BRANCH" "$BASE_SHA" "$MERGE_SHA"
      - name: Scan every commit introduced by the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: node scripts/harness/cli.mjs range "$BASE_SHA" "$HEAD_SHA" && node scripts/harness/cli.mjs range "$BASE_SHA" "$MERGE_SHA"
      - name: Scan every commit introduced by the branch update
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/harness/cli.mjs range "$BASE_SHA" "$HEAD_SHA"
      - name: Record quality job receipt
        if: always()
        env:
          JOB_NAME: quality
          JOB_STATUS: ${{ job.status }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: node scripts/harness/cli.mjs job-receipt "$RUNNER_TEMP/quality-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: ci-receipt-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-receipt.json
          retention-days: 14
          if-no-files-found: error

  windows-leases:
    needs: [event-context]
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: '3.12.11'
      - name: Confirm shared event subject
        env:
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: |
          if ((git rev-parse HEAD) -ne $env:SUBJECT_SHA -or !$env:CONTEXT_SHA256 -or !$env:BINDINGS_SHA256) {
            exit 1
          }
      - name: Verify Windows task and resource locks
        env:
          HARNESS_PYTHON: python
        run: node --test tests/harness/leases.test.mjs
      - name: Record Windows lease job receipt
        if: always()
        env:
          JOB_NAME: windows-leases
          JOB_STATUS: ${{ job.status }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: node scripts/harness/cli.mjs job-receipt "$env:RUNNER_TEMP/windows-leases-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: ci-receipt-windows-leases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-leases-receipt.json
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: [event-context]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55449:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:55449/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Confirm shared event subject
        env:
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA" && test -n "$CONTEXT_SHA256" && test -n "$BINDINGS_SHA256"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci --no-audit --no-fund
      # Discovery integration invokes the real Java parser; build its test classpath on every checkout.
      - run: npm run test:fixtures
      # Scripts/tests import generated API dist modules; build before checking them.
      - run: npm run build && npm run build:test -w @blariyo/api
      - run: npm run typecheck:scripts && npm run typecheck:tests
      - run: npm run typecheck:web
      - run: npm test
      # Integration fixtures use the macOS-compatible /private/tmp prefix.
      - run: sudo install -d -m 1777 /private/tmp
      # Full dump/restore verification runs separately; keep every push/PR CI focused on application checks.
      - run: node scripts/test-nest-integration.ts --exclude-schema-restore
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=1 tests/browser/*.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            test-results/m0-browser/
            test-results/admin-core/
          retention-days: 7
          if-no-files-found: ignore
      - name: Record application verification job receipt
        if: always()
        env:
          JOB_NAME: verify
          JOB_STATUS: ${{ job.status }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: node scripts/harness/cli.mjs job-receipt "$RUNNER_TEMP/verify-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: ci-receipt-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-receipt.json
          retention-days: 14
          if-no-files-found: error

  collector:
    needs: [event-context]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55449:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:55449/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Confirm shared event subject
        env:
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA" && test -n "$CONTEXT_SHA256" && test -n "$BINDINGS_SHA256"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci --no-audit --no-fund
      # Full Java suite, including fixture and real disposable PostgreSQL readback; skips fail the job.
      - run: npm run test:collector
      - run: apps/collector/gradlew -p apps/collector bootJar fixtureClasspath
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: collector-evidence-${{ github.sha }}
          path: |
            apps/collector/build/reports/tests/test/
            apps/collector/build/test-results/test/TEST-*.xml
            test-results/collector-ci/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: collector-build-${{ github.sha }}
          path: |
            apps/collector/build/libs/blariyo-collector-0.1.0.jar
            apps/collector/build/reports/cyclonedx/
          retention-days: 7
          if-no-files-found: error
      - name: Record Collector job receipt
        if: always()
        env:
          JOB_NAME: collector
          JOB_STATUS: ${{ job.status }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: node scripts/harness/cli.mjs job-receipt "$RUNNER_TEMP/collector-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: ci-receipt-collector-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/collector-receipt.json
          retention-days: 14
          if-no-files-found: error

  restore-scope:
    needs: [event-context]
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.classify.outputs.required }}
      core: ${{ steps.classify.outputs.core }}
      collector: ${{ steps.classify.outputs.collector }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Confirm shared event subject
        env:
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA" && test -n "$CONTEXT_SHA256" && test -n "$BINDINGS_SHA256"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - id: classify
        env:
          BASE_SHA: ${{ needs.event-context.outputs.base_sha }}
          HEAD_SHA: ${{ needs.event-context.outputs.subject_sha }}
        run: |
          node scripts/harness/restore-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Confirm shared task/change binding identity
        env:
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: test -n "$CONTEXT_SHA256" && test -n "$BINDINGS_SHA256"
      - name: Record restore classification receipt
        if: always()
        env:
          JOB_NAME: restore-scope
          JOB_STATUS: ${{ job.status }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
          RESTORE_REQUIRED: ${{ steps.classify.outputs.required }}
        run: node scripts/harness/cli.mjs job-receipt "$RUNNER_TEMP/restore-scope-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: ci-receipt-restore-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/restore-scope-receipt.json
          retention-days: 14
          if-no-files-found: error

  schema-restore:
    needs: [event-context, restore-scope]
    if: needs.restore-scope.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55449:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:55449/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Confirm shared event subject
        env:
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA" && test -n "$CONTEXT_SHA256" && test -n "$BINDINGS_SHA256"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run build:test -w @blariyo/api
      - run: sudo install -d -m 1777 /private/tmp
      - run: mkdir -p test-results && node scripts/test-nest-integration.ts apps/api/dist-test/schema-restore.integration.test.js 2>&1 | tee test-results/schema-restore.log
      - name: Bind restore result to checkout, policy, and workflow attempt
        env:
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          grep -q 'NEST_SCHEMA_RESTORE_VERIFIED' test-results/schema-restore.log
          POLICY_SHA=$(sha256sum .harness/policy.json | cut -d ' ' -f 1)
          printf 'subject_sha=%s\npolicy_sha256=%s\nrun_id=%s\nrun_attempt=%s\ncontext_sha256=%s\nbindings_sha256=%s\nrestore_event=verified\n' \
            "$SUBJECT_SHA" "$POLICY_SHA" "$RUN_ID" "$RUN_ATTEMPT" "$CONTEXT_SHA256" "$BINDINGS_SHA256" > test-results/schema-restore-evidence.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: schema-restore-${{ github.sha }}
          path: test-results/schema-restore*
          retention-days: 7
          if-no-files-found: error
      - name: Record schema restore job receipt
        if: always()
        env:
          JOB_NAME: schema-restore
          JOB_STATUS: ${{ job.status }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
          RESTORE_REQUIRED: 'true'
        run: node scripts/harness/cli.mjs job-receipt "$RUNNER_TEMP/schema-restore-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: ci-receipt-schema-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema-restore-receipt.json
          retention-days: 14
          if-no-files-found: error

  collector-schema-restore:
    needs: [event-context, restore-scope]
    if: needs.restore-scope.outputs.collector == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Confirm shared event subject
        env:
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA" && test -n "$CONTEXT_SHA256" && test -n "$BINDINGS_SHA256"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci --no-audit --no-fund
      - name: Dump, restore, and compare isolated Collector PostgreSQL databases
        env:
          GITHUB_SHA: ${{ needs.event-context.outputs.subject_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: npm run test:collector:restore
      - name: Record Collector schema restore job receipt
        if: always()
        env:
          JOB_NAME: collector-schema-restore
          JOB_STATUS: ${{ job.status }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
          RESTORE_REQUIRED: 'true'
        run: node scripts/harness/cli.mjs job-receipt "$RUNNER_TEMP/collector-schema-restore-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: collector-schema-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/collector-restore/summary.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: ci-receipt-collector-schema-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/collector-schema-restore-receipt.json
          retention-days: 14
          if-no-files-found: error

  harness-gate:
    if: always()
    needs:
      [
        event-context,
        quality,
        windows-leases,
        verify,
        collector,
        restore-scope,
        schema-restore,
        collector-schema-restore,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - name: Require all applicable checks
        env:
          QUALITY: ${{ needs.quality.result }}
          WINDOWS_LEASES: ${{ needs.windows-leases.result }}
          EVENT_CONTEXT: ${{ needs.event-context.result }}
          EVENT_NAME: ${{ needs.event-context.outputs.event_name }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
          VERIFY: ${{ needs.verify.result }}
          COLLECTOR: ${{ needs.collector.result }}
          RESTORE_SCOPE: ${{ needs.restore-scope.result }}
          RESTORE_REQUIRED: ${{ needs.restore-scope.outputs.required }}
          RESTORE_CORE: ${{ needs.restore-scope.outputs.core }}
          RESTORE_COLLECTOR: ${{ needs.restore-scope.outputs.collector }}
          RESTORE: ${{ needs.schema-restore.result }}
          COLLECTOR_RESTORE: ${{ needs.collector-schema-restore.result }}
        run: |
          test "$EVENT_CONTEXT" = success
          test -n "$EVENT_NAME"
          test -n "$CONTEXT_SHA256"
          test -n "$BINDINGS_SHA256"
          test "$QUALITY" = success
          test "$WINDOWS_LEASES" = success
          test "$VERIFY" = success
          test "$COLLECTOR" = success
          test "$RESTORE_SCOPE" = success
          test "$RESTORE_REQUIRED" = true -o "$RESTORE_REQUIRED" = false
          test "$RESTORE_CORE" = true -o "$RESTORE_CORE" = false
          test "$RESTORE_COLLECTOR" = true -o "$RESTORE_COLLECTOR" = false
          if [ "$RESTORE_CORE" = true ] || [ "$RESTORE_COLLECTOR" = true ]; then
            test "$RESTORE_REQUIRED" = true
          else
            test "$RESTORE_REQUIRED" = false
          fi
          if [ "$RESTORE_CORE" = true ]; then
            test "$RESTORE" = success
          else
            test "$RESTORE" = skipped
          fi
          if [ "$RESTORE_COLLECTOR" = true ]; then
            test "$COLLECTOR_RESTORE" = success
          else
            test "$COLLECTOR_RESTORE" = skipped
          fi
      - name: Record final harness gate diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_CONTEXT: ${{ needs.event-context.result }}
          RESTORE_REQUIRED: ${{ needs.restore-scope.outputs.required }}
          RESTORE_CORE: ${{ needs.restore-scope.outputs.core }}
          RESTORE_COLLECTOR: ${{ needs.restore-scope.outputs.collector }}
          QUALITY: ${{ needs.quality.result }}
          WINDOWS_LEASES: ${{ needs.windows-leases.result }}
          VERIFY: ${{ needs.verify.result }}
          COLLECTOR: ${{ needs.collector.result }}
          RESTORE_SCOPE: ${{ needs.restore-scope.result }}
          RESTORE: ${{ needs.schema-restore.result }}
          COLLECTOR_RESTORE: ${{ needs.collector-schema-restore.result }}
        run: |
          jq -n \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" --arg eventSha "$GITHUB_SHA" --arg status "$JOB_STATUS" \
            --arg context "$EVENT_CONTEXT" --arg quality "$QUALITY" --arg windowsLeases "$WINDOWS_LEASES" \
            --arg verify "$VERIFY" --arg collector "$COLLECTOR" --arg restoreScope "$RESTORE_SCOPE" \
            --arg restore "$RESTORE" --arg collectorRestore "$COLLECTOR_RESTORE" \
            --arg required "$RESTORE_REQUIRED" --arg core "$RESTORE_CORE" --arg collectorDb "$RESTORE_COLLECTOR" \
            'def optionalBoolean: if . == "true" then true elif . == "false" then false else null end;
             {schemaVersion:1,recordType:"ci-gate-diagnostic",verificationEvidence:false,
              run:{id:$run,attempt:$attempt,event:$event},eventSha:$eventSha,job:"harness-gate",result:$status,
              jobs:{eventContext:$context,quality:$quality,windowsLeases:$windowsLeases,verify:$verify,
                    collector:$collector,restoreScope:$restoreScope,restore:$restore,collectorRestore:$collectorRestore},
              restore:{required:($required|optionalBoolean),core:($core|optionalBoolean),collector:($collectorDb|optionalBoolean)}}' \
            > "$RUNNER_TEMP/harness-gate-diagnostic.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: ci-diagnostic-harness-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-gate-diagnostic.json
          retention-days: 14
          if-no-files-found: error
      - name: Record final harness gate receipt
        if: always() && needs.event-context.result == 'success'
        env:
          JOB_NAME: harness-gate
          JOB_STATUS: ${{ job.status }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUBJECT_SHA: ${{ needs.event-context.outputs.subject_sha }}
          CONTEXT_SHA256: ${{ needs.event-context.outputs.context_sha256 }}
          BINDINGS_SHA256: ${{ needs.event-context.outputs.bindings_sha256 }}
          RESTORE_REQUIRED: ${{ needs.restore-scope.outputs.required }}
        run: node scripts/harness/cli.mjs job-receipt "$RUNNER_TEMP/harness-gate-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always() && needs.event-context.result == 'success'
        with:
          name: ci-receipt-harness-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-gate-receipt.json
          retention-days: 14
          if-no-files-found: error
  images:
    needs: [harness-gate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (Node 24)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (Node 24)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (Node 24)
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
