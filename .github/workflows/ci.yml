name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      reused_run: ${{ steps.plan.outputs.reused_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/validation.py plan

  quality:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
      # No build, Java or database is needed to catch stale contracts.
      - run: node .githooks/check-contracts.mjs
      - run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run build:test -w @blariyo/api
      - run: npm run typecheck:scripts && npm run lint:scripts && npm run typecheck:tests && npm run lint:tests
      - run: npm run typecheck:web
      - run: npm test

  integration:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55449:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:55449/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            apps/collector/*.gradle.kts
            apps/collector/gradle.lockfile
            apps/collector/gradle/wrapper/gradle-wrapper.properties
      - run: npm ci --no-audit --no-fund
      # Discovery integration invokes the real Java parser.
      - run: npm run test:fixtures
      # BFF and sitemap integration tests also start the compiled Web server.
      - run: npm run build && npm run build:test -w @blariyo/api
      - run: sudo install -d -m 1777 /private/tmp
      # Full dump/restore still runs in the daily/manual backup workflow.
      - run: node scripts/test-nest-integration.ts --exclude-schema-restore

  browser:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55449:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:55449/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: sudo install -d -m 1777 /private/tmp
      - run: npx playwright install --with-deps chromium
      # Keep real-time scheduling tests and file-level isolation intact.
      - run: node --test --test-concurrency=1 tests/browser/*.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            test-results/m0-browser/
            test-results/admin-core/
          retention-days: 7
          if-no-files-found: ignore

  collector:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55449:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:55449/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            apps/collector/*.gradle.kts
            apps/collector/gradle.lockfile
            apps/collector/gradle/wrapper/gradle-wrapper.properties
      - run: npm ci --no-audit --no-fund
      # Full Java suite, including fixture and real disposable PostgreSQL readback; skips fail the job.
      - run: npm run test:collector
      - run: apps/collector/gradlew -p apps/collector bootJar fixtureClasspath
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: always()
        with:
          name: collector-evidence-${{ github.sha }}
          path: |
            apps/collector/build/reports/tests/test/
            apps/collector/build/test-results/test/TEST-*.xml
            test-results/collector-ci/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: collector-build-${{ github.sha }}
          path: |
            apps/collector/build/libs/blariyo-collector-0.1.0.jar
            apps/collector/build/reports/cyclonedx/
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: [plan, quality, integration, browser, collector]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Require all selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci/validation.py gate
      - name: Record full PR verification
        if: github.event_name == 'pull_request' && needs.plan.outputs.full == 'true'
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          RECEIPT: ${{ runner.temp }}/ci-verification.json
        run: python3 -B scripts/ci/validation.py receipt "$RECEIPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        if: github.event_name == 'pull_request' && needs.plan.outputs.full == 'true'
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-verification.json
          retention-days: 30
          if-no-files-found: error

  images:
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (Node 24)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (Node 24)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (Node 24)
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Record immutable image reference
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
