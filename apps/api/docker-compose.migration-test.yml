name: blariyo-migration-test

services:
  postgresql-migration-test:
    image: postgres:18
    container_name: blariyo-postgresql-migration-test
    environment:
      POSTGRES_DB: blariyo_migration_test
      POSTGRES_USER: blariyo_migration_test
      POSTGRES_PASSWORD: blariyo_migration_test
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-host=scram-sha-256
      PGTZ: UTC
    ports:
      - '127.0.0.1:45434:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20
