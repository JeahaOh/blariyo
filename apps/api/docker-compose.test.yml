services:
  postgresql-test:
    image: postgres:18
    container_name: blariyo-postgresql-test
    environment:
      POSTGRES_DB: blariyo_test
      POSTGRES_USER: blariyo_test
      POSTGRES_PASSWORD: blariyo_test
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-host=scram-sha-256
      PGTZ: UTC
    ports:
      - '127.0.0.1:45433:5432'
    volumes:
      - ../init/postgresql/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
