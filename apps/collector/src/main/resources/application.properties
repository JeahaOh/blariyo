spring.application.name=blariyo-collector
server.address=127.0.0.1
server.port=18787
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=90s
spring.datasource.url=${COLLECTOR_DATABASE_URL}
spring.datasource.username=${COLLECTOR_DATABASE_USER:collector}
spring.datasource.password=${COLLECTOR_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET timezone='UTC'
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.auto-startup=false
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.properties.org.quartz.jobStore.tablePrefix=quartz.QRTZ_
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.threadPool.threadCount=1
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.level.root=WARN
logging.level.com.blariyo.collector=INFO
collector.core-origin=${COLLECTOR_CORE_ORIGIN:http://127.0.0.1:3000}
collector.spool-directory=${COLLECTOR_SPOOL_DIRECTORY:.collector-data/spool}
collector.quartz-enabled=false
collector.discord-enabled=false

spring.main.log-startup-info=false
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n%nopex
management.endpoint.health.group.readiness.include=readinessState,collectorLocal
server.tomcat.connection-timeout=5s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=90s
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=200MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.clean-history-on-start=true
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n%nopex

management.metrics.enable.disk=false
spring.task.scheduling.pool.size=4

spring.main.banner-mode=off
logging.structured.format.console=ecs
logging.structured.format.file=ecs
logging.structured.json.exclude=error,error.type,error.message,error.stack_trace
logging.level.net.dv8tion.jda=OFF
