# Separate gateway project; existing app release files remain immutable.
name: blariyo-gateway
services:
  nginx:
    image: nginx:1.30.5-alpine@sha256:ef8676b33d681f272ba429b27658bdd7e640963279714c96bddf1dc76307f7b6
    platform: linux/amd64
    user: "101:101"
    entrypoint: [nginx]
    command: [-c, /etc/nginx/nginx.conf, -g, "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    memswap_limit: 96m
    pids_limit: 32
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    tmpfs: ["/tmp:size=16m,mode=1777,noexec,nosuid"]
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/__gateway_health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  edge:
    external: true
    name: blariyo-app_edge
