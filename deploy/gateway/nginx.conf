# Only reachable on the private Docker edge network through cloudflared.
worker_processes 1;
pid /tmp/nginx.pid;
# Raw request error logs can contain queries. Safe status/timing are in access JSON.
error_log /dev/stderr emerg;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    # Errors must not become cached static assets, including Nitro JSON errors.
    # Preserve the upstream policy for successful and redirect responses.
    map $status $safe_cache_control {
        ~^[45] no-store;
        default $upstream_http_cache_control;
    }
    map $uri $route_group {
        default public;
        ~^/admin admin;
        ~^/api/v1/admin/ admin_api;
        ~^/api/collector/ collector;
        ~^/api/ api;
        ~^/internal internal_denied;
        ~^/health/ health;
        /__gateway_health gateway_health;
    }
    log_format safe escape=json '{"requestId":"$request_id","route":"$route_group","status":$status,"duration":$request_time,"upstreamStatus":"$upstream_status"}';
    access_log /dev/stdout safe;
    add_header Cache-Control $safe_cache_control always;
    keepalive_timeout 15s;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    client_max_body_size 101m;
    server {
        listen 8080 default_server;
        server_name _;
        location = /__gateway_health { access_log off; return 200 'UP\n'; }
        location / { return 421; }
    }
    server {
        listen 8080;
        server_name www.blariyo.com;
        return 308 https://blariyo.com$request_uri;
    }
    server {
        listen 8080;
        server_name blariyo.com;
        location = /__gateway_health { access_log off; return 200 'UP\n'; }
        location = /internal { return 404; }
        location ^~ /internal/ { return 404; }
        location / {
            # Constant hostname; request input must never choose the upstream.
            # Variable resolution allows Web replacement without an Nginx restart.
            set $web_origin http://web:3000;
            proxy_pass $web_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host blariyo.com;
            proxy_set_header X-Forwarded-Host blariyo.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For '';
            proxy_set_header X-Real-IP '';
            proxy_set_header Forwarded '';
            proxy_set_header X-Request-ID $request_id;
            # CF-Access-Jwt-Assertion/Cookie/CF-Connecting-IP are passed as received.
            # Web validates JWT itself; client IP trust is enabled only after Tunnel boundary checks.
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_hide_header Cache-Control;
            proxy_next_upstream off;
        }
    }
}
