# Private socket; no host/system journal forwarding. Only these three application tags.
global(workDirectory="/run/blariyo-logs" maxMessageSize="16k")
module(load="imuxsock" SysSock.Use="off")
template(name="BlariyoFile" type="string" string="/var/log/blariyo/application/%$year%-%$month%-%$day%.log")
template(name="BlariyoLine" type="string" string="%timegenerated:::date-rfc3339% %programname% %msg:::drop-last-lf%\n")
ruleset(name="blariyo") {
  if ($programname == "blariyo-api" or $programname == "blariyo-web" or $programname == "blariyo-nginx") then {
    action(type="omfile" dynaFile="BlariyoFile" template="BlariyoLine" fileCreateMode="0600" dirCreateMode="0700" createDirs="on")
  }
  stop
}
input(type="imuxsock" Socket="/run/blariyo-logs/log.sock" CreatePath="on" ParseHostname="on" UseSpecialParser="off" Ruleset="blariyo")
