# Only the postgres OS user can administer through the local socket.
local all postgres peer
local all all reject
# No host port is published in production; only clients on the data network reach these rules.
host blariyo blariyo_app,blariyo_migrator,blariyo_backup,blariyo_batch 0.0.0.0/0 scram-sha-256
host blariyo blariyo_app,blariyo_migrator,blariyo_backup,blariyo_batch ::/0 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
